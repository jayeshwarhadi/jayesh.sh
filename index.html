<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font : Cascadia Code import cdn -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code&display=swap"
      rel="stylesheet"
    />
    <title>jayesh.sh</title>
  </head>
  <body>
    <!-- Sets default theme to dark if none is selected else fetches theme from local Storage
         and applies the appropritate theme to the page
    -->
    <script src="scripts/defaultTheme.js"></script>
    <div class="container">
      <div class="title">
        <div class="actionBtn">
          <!-- These are circle buttons linking github repo and refresh-->
          <div class="circle">
            <a href="https://github.com/jayeshwarhadi/jayesh.sh" target="_blank"
              ><img src="Assets/star.webp" alt="give a github star"
            /></a>
          </div>
          <div class="circle">
            <a
              style="cursor: pointer"
              onclick="
                location.reload();
                return false;
              "
              ><img src="Assets/refresh.webp" alt="refresh website"
            /></a>
            <!-- Refreshes the website -->
          </div>
        </div>
        <h2>terminal@portfolio ~ jayesh.sh</h2>
        <div class="actionBtn">
          <!-- Button associated with theme change -->
          <div class="circle">
            <a id="themeBtn" style="cursor: pointer"
              ><img src="Assets/theme.webp" alt="change theme"
            /></a>
          </div>
        </div>
      </div>
      <!-- Content starts -->
      <div class="content">
        <p id="start">Initializing<span class="loadingDots"></span></p>
        <p id="intro" style="white-space: pre-wrap"></p>
        <p id="user-commands">
          <!-- <div class="output-block">
            <a href="#" class="btn">test</a>
            <a href="#" class="highlight">test</a>
            <a href="#" class="link">test</a>
            <a href="#" class="image">test</a>
          </div> -->
        </p>
        <p id="address" style="display: none">
          guest@portfolio:<span class="location">~/</span>$
          <input type="text" id="user-input" autocomplete="off" autofocus />
        </p>
      </div>
    </div>
    <div id="popupWindow" class="container">
      <div class="title">
        <div class="actionBtn">
          <!-- circle button linking github repo-->
          <div class="circle">
            <a href="https://github.com/jayeshwarhadi/jayesh.sh" target="_blank"
              ><img src="Assets/star.webp" alt="give a github star"
            /></a>
          </div>
          <div id="closePopup" class="circle">
            <a style="cursor: pointer"
              ><img src="Assets/close.webp" alt="close popup"
            /></a>
          </div>
        </div>
        <h2></h2>
      </div>
      <div class="content"></div>
    </div>
    <!-- JQuery Google CDN link then external JS file -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
