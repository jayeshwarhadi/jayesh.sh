<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code&display=swap"
      rel="stylesheet"
    />
    <title>jayesh.sh</title>
  </head>
  <body>
    <div id="container">
      <div id="title">
        <div class="actionBtn">
          <div class="circle">
            <a href="https://github.com/jayeshwarhadi/jayesh.sh" target="_blank"
              ><img src="Assets/star.webp" alt="give a github star"
            /></a>
          </div>
          <div class="circle">
            <a
              style="cursor: pointer"
              onclick="
                location.reload();
                return false;
              "
              ><img src="Assets/refresh.webp" alt="refresh website"
            /></a>
          </div>
        </div>
        <h2>terminal@portfolio ~ jayesh.sh</h2>
        <div class="actionBtn">
          <div class="circle">
            <a style="cursor: pointer"
              ><img src="Assets/theme.webp" alt="change theme"
            /></a>
          </div>
        </div>
      </div>
      <div id="content"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
